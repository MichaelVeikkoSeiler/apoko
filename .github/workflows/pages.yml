name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # jeden Montag die Swissmedic-Liste neu laden
    - cron: '17 3 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Swissmedic-Liste der zugelassenen Packungen laden
        # schlägt das fehl, geht die App trotzdem online (dann ohne Namensvorschlag)
        continue-on-error: true
        run: |
          pip install openpyxl
          mkdir -p data
          python scripts/build_swissmedic.py --download data/swissmedic.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
